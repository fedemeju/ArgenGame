<!doctype html>
<meta charset="utf-8">
<!-- Pasa un personaje hecho con IA (estilo liso, fondo magenta aunque tenga degradé o sombras) a PNG transparente.
     Uso: tools/importar-personaje.html?src=../assets/nuevas/tero.jfif&cuadros=2&ancho=300
     - Saca el fondo con borde suave y le quita el tinte magenta a los bordes (pelo, plumas).
     - Con cuadros=N corta la imagen en N partes iguales de izquierda a derecha y las recorta todas
       con el mismo rectángulo, así la animación no salta.
     - Achica cada cuadro a "ancho" píxeles y deja los PNG en #out. -->
<style>body{margin:0;background:#6a8fb0;font:12px monospace}canvas{margin:6px;background:#9ab}</style>
<pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search);
const N = Number(q.get('cuadros') || 1), TW = Number(q.get('ancho') || 300);
const img = new Image();
img.onload = () => {
  const w = img.width, h = img.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], gr = d[i + 1], b = d[i + 2];
    const m = Math.min(r - gr, b - gr);              // cuánto "magenta" tiene
    let a = 1 - (m - 10) / 50;
    a = a < 0.08 ? 0 : Math.min(1, a);
    d[i + 3] = Math.round(a * 255);
    if (a > 0 && m > 0) {                            // saca el tinte magenta del borde
      d[i + 2] = Math.min(b, gr + 4);
      d[i] = Math.min(r, gr * 1.55 + 12);
    }
  }
  g.putImageData(id, 0, 0);
  // mismo rectángulo para todos los cuadros (en coordenadas de cada parte)
  const pw = Math.floor(w / N);
  let x0 = pw, y0 = h, x1 = -1, y1 = -1;
  for (let f = 0; f < N; f++) for (let y = 0; y < h; y++) for (let x = 0; x < pw; x++) {
    if (d[(y * w + f * pw + x) * 4 + 3] < 128) continue;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  x0 = Math.max(0, x0 - 2); y0 = Math.max(0, y0 - 2); x1 = Math.min(pw - 1, x1 + 2); y1 = Math.min(h - 1, y1 + 2);
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, TH = Math.round(bh * TW / bw);
  const lines = [];
  // con tira=1 sale un solo PNG con todos los cuadros uno al lado del otro (un solo archivo para el celular)
  const strip = q.get('tira') ? Object.assign(document.createElement('canvas'), { width: TW * N, height: TH }) : null;
  for (let f = 0; f < N; f++) {
    // achica de a mitades para que quede suave
    let src = document.createElement('canvas'); src.width = bw; src.height = bh;
    src.getContext('2d').drawImage(c, f * pw + x0, y0, bw, bh, 0, 0, bw, bh);
    while (src.width / 2 > TW) {
      const t = document.createElement('canvas'); t.width = Math.round(src.width / 2); t.height = Math.round(src.height / 2);
      const tg = t.getContext('2d'); tg.imageSmoothingQuality = 'high'; tg.drawImage(src, 0, 0, t.width, t.height);
      src = t;
    }
    const o = document.createElement('canvas'); o.width = TW; o.height = TH;
    const og = o.getContext('2d'); og.imageSmoothingQuality = 'high'; og.drawImage(src, 0, 0, TW, TH);
    if (strip) { strip.getContext('2d').drawImage(o, f * TW, 0); continue; }
    document.body.appendChild(o);
    lines.push('PNG' + f + ':' + o.toDataURL('image/png') + ':FIN');
  }
  // &formato=webp: mucho más liviano y sigue siendo transparente
  if (strip) { document.body.appendChild(strip); lines.push('PNG0:' + strip.toDataURL(q.get('formato') === 'webp' ? 'image/webp' : 'image/png', 0.86) + ':FIN'); }
  document.getElementById('out').textContent = lines.join('\n') + '\nTAM ' + TW + 'x' + TH;
};
img.onerror = () => { document.getElementById('out').textContent = 'ERROR: no se pudo abrir ' + q.get('src'); };
img.src = q.get('src');
</script>
