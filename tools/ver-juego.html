<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<!-- Dibuja un cuadro de un juego para sacarle captura sin depender del panel del navegador.
     ?juego=carpincho&pasos=300&seed=3   (pasos de 16 ms antes de congelar)
     &accion=saltar|agachar  (se aprieta 6 pasos antes del final)   &propias=no  (sin imágenes de assets/) -->
<style>body{margin:0;background:#222}#g{position:relative;width:100vw;height:100vh;overflow:hidden}</style>
<div id="g"></div>
<pre id="err" style="position:fixed;left:0;top:0;margin:0;color:#f66;font:12px monospace;white-space:pre-wrap"></pre>
<script>
  // los errores se muestran en pantalla: en la captura sin ventana no hay consola
  const showErr = m => { document.getElementById('err').textContent += m + '\n'; };
  addEventListener('error', e => showErr('ERROR ' + e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  addEventListener('unhandledrejection', e => showErr('ERROR ' + (e.reason && e.reason.stack || e.reason)));
</script>
<script type="module">
import { GAMES } from './games/index.js';
import { loadCustomArt } from './js/art.js';
const q = new URLSearchParams(location.search);
if (q.get('propias') !== 'no') { loadCustomArt(); await new Promise(r => setTimeout(r, 600)); }
const game = GAMES[q.get('juego') || 'carpincho'];
const inst = game.mount(document.getElementById('g'), { seed: Number(q.get('seed') || 3), onScore() {}, onEnd() {} });
window.__inst = inst; // para revisar desde la consola
// &exportar=ms: pasado ese tiempo deja el lienzo como PNG en la página (PNG0:...:FIN), para leerlo con msedge --dump-dom
// cuando la captura de pantalla sale vacía (pasa con Pana Express)
if (q.get('exportar')) setTimeout(() => {
  // dibuja un cuadro a mano: sin ventana, a veces el navegador casi no da cuadros y el lienzo queda vacío
  if (inst._draw) inst._draw(16, performance.now());
  const cv = document.querySelector('#g canvas');
  document.getElementById('err').textContent = 'PNG0:' + cv.toDataURL('image/png') + ':FIN';
}, Number(q.get('exportar')));
// &diag=1: al segundo y medio anota cuántos cuadros se dibujaron y el color del centro del lienzo
if (q.get('diag')) {
  let frames = 0; const tick = () => { frames++; requestAnimationFrame(tick); }; requestAnimationFrame(tick);
  setTimeout(() => {
    const cv = document.querySelector('#g canvas'), px = cv ? cv.getContext('2d').getImageData(cv.width >> 1, cv.height >> 1, 1, 1).data : [];
    showErr(`DIAG cuadros=${frames} lienzo=${cv ? cv.width + 'x' + cv.height : 'no'} centro=${[...px].join(',')}`);
  }, 1500);
}
const steps = Number(q.get('pasos') || 0), acc = q.get('accion');
if (steps) {
  if (inst._press) inst._press('jump', false); else inst._move(0);
  const S = inst._state, ph = inst._phys || {};
  const tUp = h => (ph.JUMP_V - Math.sqrt(Math.max(0, ph.JUMP_V ** 2 - 2 * ph.G * h))) / ph.G;
  for (let i = 0; i < steps; i++) {
    if (acc && i === steps - 6) inst._press(acc === 'saltar' ? 'jump' : 'duck', true);
    // &piloto=1: en el carpincho salta y se agacha solo, como en tests/carpincho.sim.mjs
    if (q.get('piloto') && inst._obsX) {
      const v = ph.speed(S.d);
      const n = S.obs.map(o => [o, inst._obsX(o)]).filter(([o, x]) => x + o.w > S.d - 0.5).sort((a, b) => a[1] - b[1])[0];
      if (n) {
        const [o, x] = n, tc = (x - (S.d + 0.55)) / (v + o.vx);
        if (o.low) { if (S.duckHeld) inst._press('duck', false); if (S.y === 0 && tc <= tUp(o.y1) + 0.01) inst._press('jump', true); }
        else inst._press('duck', tc < (S.y > 0 ? 0.6 : 0.3));
      }
    }
    // &piloto=1 en el tero: aletea apuntando al centro del hueco, como en tests/tero.sim.mjs
    if (q.get('piloto') && inst._flap) {
      const next = S.pipes.find(p => p.x + inst._phys.PW + inst._phys.R > S.x);
      if (next && S.y > (next.top + next.bot) / 2 + 0.025 && S.vy > -0.15) inst._flap();
    }
    inst._update(16);
  }
  inst._state.started = false;
}
</script>
